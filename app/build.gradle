plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'elemsocial.com'
    compileSdk 36

    defaultConfig {
        applicationId 'elemsocial.com'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')

    // Jetpack Compose
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'

    // AndroidX Activity / Core / SplashScreen / annotations
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.annotation:annotation:1.9.1'

    // Lifecycle (collectAsState)
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Networking / WebSocket
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.6.0'

    // MessagePack
    implementation 'org.msgpack:msgpack-core:0.9.12'

    // Media playback
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'

    // Lottie Compose
    implementation 'com.airbnb.android:lottie-compose:6.7.1'

    // SVG rendering
    implementation 'com.caverock:androidsvg:1.4'

    // Jetpack Graphics (libandroidx.graphics.path.so)
    implementation 'androidx.graphics:graphics-path:1.1.0'

    // Local unit tests
    testImplementation 'junit:junit:4.13.2'

    // Instrumented tests
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    // Compose tooling / test manifest for debug builds
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
