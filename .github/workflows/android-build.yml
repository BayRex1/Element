name: Android debug APK

on:
  push:
    branches:
      - nimarkogram-plugin-compat
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Create temporary CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-debug.keystore" \
            -storepass android \
            -keypass android \
            -alias ci-debug \
            -dname "CN=GitHub Actions Debug,O=CI,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ci-debug.keystore"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEY_ALIAS=ci-debug"
            echo "KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: element-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
